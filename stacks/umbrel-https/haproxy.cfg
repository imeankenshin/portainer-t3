global
    log stdout format raw local0
    maxconn 1024

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h

# Only Tailscale Serve reaches this listener. TLS stays encrypted through
# HAProxy; each destination keeps its existing certificate and authentication.
frontend tailscale_https
    bind 127.0.0.1:24443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend umbrel_dashboard if { req.ssl_sni -i umbrel umbrel.local }
    default_backend t3_code

backend umbrel_dashboard
    server dashboard 127.0.0.1:443

backend t3_code
    server tailscale_https 100.110.109.117:9443

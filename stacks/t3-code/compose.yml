services:
  t3-code:
    hostname: "${T3_ENVIRONMENT_NAME:?Set T3_ENVIRONMENT_NAME, for example business or personal}"
    image: "${T3_CODE_IMAGE:-ghcr.io/imeankenshin/t3-code@sha256:2be2e47c01fd8d991ced78b3d1563640103741e90d2185e36a05c5fda52bd2ae}"
    # dockerd runs inside this container and needs the privileges of DinD.
    privileged: true
    restart: unless-stopped
    # Leave time for T3 Code to stop and for dockerd to stop its containers.
    stop_grace_period: 1m
    environment:
      TZ: "${TZ:-Asia/Tokyo}"
      T3CODE_HOME: /var/lib/t3
      T3CODE_HOST: 0.0.0.0
      T3CODE_PORT: "3773"
      T3CODE_LOG_LEVEL: "${T3CODE_LOG_LEVEL:-Info}"
      DOCKERD_ENABLED: "1"
      DOCKERD_ARGS: >-
        --storage-driver=overlay2
        --bip=${DIND_BIP:?Set DIND_BIP, for example 10.60.0.1/24}
        --default-address-pool=base=${DIND_ADDRESS_POOL:?Set DIND_ADDRESS_POOL, for example 10.60.128.0/17},size=24
        --dns=${DNS_PRIMARY:-1.1.1.1}
        --dns=${DNS_SECONDARY:-8.8.8.8}
        --log-driver=local
      GIT_USER_NAME: "${GIT_USER_NAME:?Set GIT_USER_NAME}"
      GIT_USER_EMAIL: "${GIT_USER_EMAIL:?Set GIT_USER_EMAIL}"
    dns:
      - "${DNS_PRIMARY:-1.1.1.1}"
      - "${DNS_SECONDARY:-8.8.8.8}"
    ports:
      - "127.0.0.1:${T3_HOST_PORT:?Set T3_HOST_PORT}:3773"
      - "127.0.0.1:${PREVIEW_HOST_START:?Set PREVIEW_HOST_START}-${PREVIEW_HOST_END:?Set PREVIEW_HOST_END}:30000-30049"
    volumes:
      - t3_data:/var/lib/t3
      - opencode_data:/home/user/.local/share/opencode
      - codex_data:/home/user/.codex
      - claude_data:/home/user/.claude
      - user_config:/home/user/.config
      - npm_cache:/home/user/.npm
      - ssh_data:/home/user/.ssh
      - workspace:/workspace
      - docker_data:/var/lib/docker
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: "${MEMORY_LIMIT:-5g}"
    cpus: "${CPU_LIMIT:-6.0}"
    pids_limit: 5120
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const s=require('net').connect(3773,'127.0.0.1');
          s.on('connect',()=>{s.end();process.exit(0)});
          s.on('error',()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  default:
    ipam:
      config:
        - subnet: "${STACK_SUBNET:?Set STACK_SUBNET}"

volumes:
  docker_data:
  t3_data:
  opencode_data:
  codex_data:
  claude_data:
  user_config:
  npm_cache:
  ssh_data:
  workspace:

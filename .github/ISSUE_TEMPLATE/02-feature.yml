name: 機能要望
description: 新機能や既存機能の改善を提案します
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: checkboxes
    id: existing-issue
    attributes:
      label: 既存Issueの確認
      options:
        - label: 同じ内容のIssueがないことを確認しました
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: 誰が、どの状況で、何に困っているかを記載してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決策
      description: 期待する利用方法や動作を記載してください。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: 実装完了を確認できる条件を箇条書きで記載してください。
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した別の方法や現在の回避策があれば記載してください。
  - type: textarea
    id: context
    attributes:
      label: 補足
      description: 関連Issue、資料、図などがあれば追加してください。
